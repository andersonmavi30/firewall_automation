[defaults]
inventory = inventories/netbox/netbox_inventory.yml
roles_path = roles
collections_path = /opt/firewall-automation/collections:/root/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent

[inventory]
enable_plugins = auto, yaml, ini, netbox.netbox.nb_inventory
