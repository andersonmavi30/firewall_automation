---
- name: Backup automatico de configuracion FortiGate
  hosts: platform_fortios
  gather_facts: false
  serial: 1

  vars:
    ansible_connection: httpapi
    ansible_network_os: fortinet.fortios.fortios
    ansible_httpapi_use_ssl: false
    ansible_httpapi_validate_certs: false
    ansible_httpapi_port: 80
    fortios_vdom: root

    ansible_httpapi_session_key:
      access_token: "{{ fortios_access_tokens[inventory_hostname] | trim }}"

  roles:
    - role: fortigate_backup